<!-- Badge v1: Face silhouette in profile, green = verified, red = not verified -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <clipPath id="circle-clip">
      <circle cx="60" cy="60" r="56"/>
    </clipPath>
  </defs>

  <!-- Verified variant (green) -->
  <g transform="translate(0,0)">
    <!-- Background circle -->
    <circle cx="60" cy="60" r="56" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>

    <!-- Human profile silhouette (facing right) — green fill -->
    <!-- Head -->
    <circle cx="55" cy="38" r="15" fill="#16a34a"/>
    <!-- Neck -->
    <rect x="49" y="51" width="12" height="10" rx="3" fill="#16a34a"/>
    <!-- Shoulders/body -->
    <path d="M 20 90 Q 20 65 55 65 Q 90 65 90 90 Z" fill="#16a34a"/>

    <!-- Checkmark badge (bottom-right) -->
    <circle cx="85" cy="85" r="18" fill="#16a34a" stroke="#fff" stroke-width="3"/>
    <polyline points="76,85 83,93 95,76" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
