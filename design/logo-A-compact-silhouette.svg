<!-- Logo variant A — Compact silhouette with integrated check rim
     Strategy: silhouette profile facing right; the "shoulders" arc curves up into a
     check-mark tail on the right. One shape, reads clearly at 16×16. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="APTOGON verified human">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>

  <!-- Profile silhouette: head + bust merged into one path facing right -->
  <path d="M 38 28
           a 12 12 0 1 1 0 0.01 Z" fill="#16a34a"/>
  <!-- Head as solid circle (cleaner at small sizes than a path approximation) -->
  <circle cx="44" cy="36" r="11" fill="#16a34a"/>

  <!-- Shoulders/body — broad ellipse, with right edge extending into a check tail -->
  <path d="M 22 78
           Q 22 54 44 54
           Q 66 54 66 70
           L 72 76
           L 86 56"
        fill="none" stroke="#16a34a" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
