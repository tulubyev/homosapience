<!-- Badge v2: All 3 states side by side — Verified (green), Not Verified (grey+strikethrough), Revoked (red+X) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" width="420" height="160"
     style="font-family: Inter, system-ui, sans-serif;">

  <!-- === STATE 1: VERIFIED (green) === -->
  <g transform="translate(20, 10)">
    <circle cx="60" cy="60" r="56" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
    <!-- Head -->
    <circle cx="55" cy="37" r="14" fill="#16a34a"/>
    <!-- Body -->
    <path d="M 18 108 Q 18 66 55 66 Q 92 66 92 108 Z" fill="#16a34a" clip-path="url(#c1)"/>
    <clipPath id="c1"><circle cx="60" cy="60" r="54"/></clipPath>
    <!-- Badge -->
    <circle cx="86" cy="86" r="17" fill="#16a34a" stroke="#fff" stroke-width="2.5"/>
    <polyline points="78,86 85,93 96,77" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="60" y="132" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">Verified</text>
    <text x="60" y="147" text-anchor="middle" font-size="9" fill="#86efac">HUMAN</text>
  </g>

  <!-- === STATE 2: NOT VERIFIED (grey + diagonal strikethrough) === -->
  <g transform="translate(155, 10)">
    <circle cx="60" cy="60" r="56" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
    <!-- Head -->
    <circle cx="55" cy="37" r="14" fill="#94a3b8"/>
    <!-- Body -->
    <path d="M 18 108 Q 18 66 55 66 Q 92 66 92 108 Z" fill="#94a3b8" clip-path="url(#c2)"/>
    <clipPath id="c2"><circle cx="60" cy="60" r="54"/></clipPath>
    <!-- Strikethrough circle -->
    <circle cx="60" cy="60" r="56" fill="none" stroke="#ef4444" stroke-width="4" opacity="0.6"/>
    <line x1="20" y1="20" x2="100" y2="100" stroke="#ef4444" stroke-width="5" stroke-linecap="round" opacity="0.7"/>

    <text x="60" y="132" text-anchor="middle" font-size="11" font-weight="700" fill="#64748b">Not Verified</text>
    <text x="60" y="147" text-anchor="middle" font-size="9" fill="#94a3b8">UNVERIFIED</text>
  </g>

  <!-- === STATE 3: REVOKED / SUSPICIOUS (red with X) === -->
  <g transform="translate(290, 10)">
    <circle cx="60" cy="60" r="56" fill="#fff1f2" stroke="#dc2626" stroke-width="3"/>
    <!-- Head (red) -->
    <circle cx="55" cy="37" r="14" fill="#dc2626"/>
    <!-- Body -->
    <path d="M 18 108 Q 18 66 55 66 Q 92 66 92 108 Z" fill="#dc2626" clip-path="url(#c3)"/>
    <clipPath id="c3"><circle cx="60" cy="60" r="54"/></clipPath>
    <!-- X badge -->
    <circle cx="86" cy="86" r="17" fill="#dc2626" stroke="#fff" stroke-width="2.5"/>
    <line x1="78" y1="78" x2="94" y2="94" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <line x1="94" y1="78" x2="78" y2="94" stroke="#fff" stroke-width="4" stroke-linecap="round"/>

    <text x="60" y="132" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">Bot / Revoked</text>
    <text x="60" y="147" text-anchor="middle" font-size="9" fill="#fca5a5">BLOCKED</text>
  </g>
</svg>
