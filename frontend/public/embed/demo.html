<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>APTOGON widget demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body style="font-family:Inter,system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 16px">
  <h1>APTOGON "Verify with APTOGON" demo</h1>
  <p>Declarative button (uses <code>data-aptogon-verify</code>):</p>
  <div data-aptogon-verify data-on-success="onHuman" data-on-error="onErr"></div>

  <p style="margin-top:24px">Programmatic:</p>
  <button id="prog" type="button" style="padding:10px 18px;border:none;border-radius:10px;background:#0891b2;color:#fff;font-weight:700;cursor:pointer">Aptogon.verify()</button>

  <pre id="out" style="background:#0f172a;color:#7ee787;padding:12px;border-radius:8px;margin-top:20px;white-space:pre-wrap;word-break:break-all"></pre>

  <!-- Replace data-aptogon-key with a real pk_live_… before testing -->
  <script src="https://homosapience.org/embed/v1/aptogon.js"
          data-aptogon-key="pk_live_REPLACE_ME"></script>
  <script>
    var out = document.getElementById('out');
    function show(label, v) { out.textContent += label + ': ' + JSON.stringify(v, null, 2) + '\n'; }
    function onHuman(r) { show('declarative success', r); }
    function onErr(e) { show('declarative error', String(e)); }
    document.getElementById('prog').addEventListener('click', function () {
      window.Aptogon.verify()
        .then(function (r) { show('programmatic success', r); })
        .catch(function (e) { show('programmatic error', String(e)); });
    });
  </script>
</body>
</html>
