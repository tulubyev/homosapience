<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>APTOGON — Verify you're human</title>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --accent:#7c3aed; --accent2:#a855f7; --ok:#22c55e; --txt:#e2e8f0; --muted:#94a3b8; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin:0; height:100%; background:var(--bg); color:var(--txt);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    /* Constrain to a phone-sized column on wide viewports (desktop browser testing);
       on real phones (viewport <= max-width) this is a no-op — content stays edge-to-edge. */
    body { display:flex; justify-content:center; }
    @media (min-width:431px) {
      body { background:#05070d; }
      #app { box-shadow:0 0 60px rgba(0,0,0,.5); }
    }
    #app { display:flex; flex-direction:column; min-height:100%; width:100%; max-width:430px;
      padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
    header { text-align:center; padding:20px 0 8px; }
    header h1 { margin:0; font-size:20px; font-weight:800; }
    header p { margin:4px 0 0; font-size:13px; color:var(--muted); }
    .card { background:var(--card); border-radius:18px; padding:18px; margin-top:14px; }
    #pad { width:100%; aspect-ratio:1/1; background:#0b1220; border:2px dashed rgba(124,58,237,.4);
      border-radius:16px; touch-action:none; display:block; }
    .hint { font-size:12px; color:var(--muted); text-align:center; margin-top:10px; min-height:16px; }
    button { width:100%; padding:14px; border:none; border-radius:14px; font-size:15px; font-weight:800;
      color:#fff; background:linear-gradient(135deg,var(--accent),var(--accent2)); margin-top:14px; }
    button:disabled { opacity:.5; }
    .row { display:flex; gap:10px; }
    .field { flex:1; background:#0b1220; border-radius:12px; padding:10px 12px; }
    .field .k { font-size:10px; color:var(--muted); text-transform:uppercase; }
    .field .v { font-size:13px; word-break:break-all; }
    .hidden { display:none; }
    .ok { color:var(--ok); }
    .err { color:#f87171; }
    a { color:var(--accent2); }
    #padwrap { position:relative; }
    #dot { position:absolute; width:54px; height:54px; margin:-27px 0 0 -27px; border-radius:50%;
      pointer-events:none; box-shadow:0 0 0 6px rgba(255,255,255,.15); transition:opacity .12s;
      display:flex; align-items:center; justify-content:center; font-size:22px; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>✦ Prove you're human</h1>
      <p>Draw a free gesture for ~10 seconds. No account, no email.</p>
    </header>

    <!-- Draw stage -->
    <section id="draw" class="card">
      <div id="padwrap">
        <canvas id="pad"></canvas>
        <div id="dot" class="hidden">👆</div>
      </div>
      <div id="hint" class="hint">Touch and draw — keep moving, vary speed, pause sometimes.</div>
      <button id="submit" disabled>Keep drawing…</button>
    </section>

    <!-- Result stage -->
    <section id="result" class="card hidden"></section>

    <p style="text-align:center;font-size:11px;color:var(--muted);margin-top:auto;padding:16px 0;">
      Zero PII · anonymous DID on Aptos · <a href="https://homosapience.org" target="_blank">homosapience.org</a>
    </p>
  </div>
  <script src="app.js"></script>
</body>
</html>
